openapi: 3.1.0
info:
  title: App Backend API
  version: 0.1.0
  description: |
    The template's API contract. MAINTAINED PAIRWISE with the Postman
    collection at docs/postman/ — any route/param/contract change updates both
    in the same commit. Served as Swagger UI at `<base>/docs/` when
    API_DOCS_ENABLED (on in the dev stack, off everywhere else).

    Authentication: the browser signs in through POST /auth/login and carries
    HttpOnly cookies; direct callers (this UI, Postman) send a Keycloak Bearer
    token instead. Every error is RFC-7807 problem+json.
servers:
  - url: /app/v1
    description: Frontend proxy path
  - url: /api/v1
    description: Direct path (Postman, smoke tests)
tags:
  - name: health
  - name: auth
  - name: me
  - name: notes
    description: The example feature — delete or rename in a fork
  - name: accounts
    description: Set-password invitations (admin half)
  - name: password-setup
    description: Set-password links (public half)
  - name: documents
    description: The external document store facade
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness + dependency readiness
      description: Mounted at the SERVER ROOT, outside the versioned base paths.
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Healthy (db reachable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Degraded (db unreachable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Password sign-in (sets HttpOnly session cookies)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in; cookies set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the session from the refresh cookie
      security: []
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the Keycloak session and clear the cookies
      security: []
      responses:
        '204': { description: Signed out }
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Who is signed in (the reload path — 200 either way)
      security: []
      responses:
        '200':
          description: The session, or `{authenticated:false}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: The caller's identity and effective permissions
      responses:
        '200':
          description: Identity + the permissions map the UI drives show/hide from
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes (search + paging)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Note' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note (MANAGER/ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                body: { type: string }
                tags: { type: array, items: { type: string } }
                actionUuid:
                  type: string
                  description: Optional replay protection — the same uuid twice answers 409.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /notes/{noteId}:
    parameters:
      - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNote
      tags: [notes]
      summary: One note
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Change title/body/tags (MANAGER/ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note (MANAGER/ADMIN)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /accounts/{kcUserId}/password-email:
    post:
      operationId: sendPasswordEmail
      tags: [accounts]
      summary: Mail (or re-mail) the set-password link for one account
      description: |
        Needs `realm-management: manage-users` on the CALLER's own token. The
        address is read from the account, never from the body; the token is
        never in the response.
      parameters:
        - { name: kcUserId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [provision, reset], default: provision }
      responses:
        '200':
          description: Invitation minted; `mailed` says whether the relay accepted it
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailed: { type: boolean }
                  reason: { type: [string, 'null'] }
                  maskedTo: { type: string }
                  expiresAt: { type: string, format: date-time }
                  mailConfigured: { type: boolean }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /accounts/password-invitations:
    get:
      operationId: listPasswordInvitations
      tags: [accounts]
      summary: Every account's latest invitation (the register's Password column)
      responses:
        '200':
          description: One row per account
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/PasswordInvitation' }
        '403': { $ref: '#/components/responses/Problem' }

  /password-setup/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: describePasswordSetup
      tags: [password-setup]
      summary: Is this link still good, and whose account is it? (public)
      security: []
      responses:
        '200':
          description: Valid — names the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  username: { type: string }
                  expiresAt: { type: string, format: date-time }
        '410': { description: 'Spent, stale or unknown — one answer for all three' }
    post:
      operationId: completePasswordSetup
      tags: [password-setup]
      summary: Spend the link and set the password (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 10 }
      responses:
        '200':
          description: Password set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  username: { type: string }
        '410': { description: 'Spent, stale or unknown' }
        '422': { description: 'Keycloak refused the password (policy) — the link is released' }

  /document/upload:
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Store a binary in the document store
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                documentType: { type: string, description: Mayan document-type label }
                folder: { type: string, description: 'Cabinet path, e.g. app/uploads/123' }
                comment: { type: string }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId: { type: string, example: DOC-42 }
        '401': { $ref: '#/components/responses/Problem' }
  /document/list:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: Documents filed in one folder
      parameters:
        - { name: folder, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The folder's documents (empty for unknown folders)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StoredDocument' }
  /document/view:
    get:
      operationId: viewDocument
      tags: [documents]
      summary: Stream the latest binary (or the version history with meta=true)
      parameters:
        - { name: docId, in: query, required: true, schema: { type: string } }
        - { name: meta, in: query, schema: { type: boolean } }
      responses:
        '200': { description: The binary (or JSON metadata) }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { description: DMS disabled — this deployment stores metadata only }

security:
  - bearerAuth: []
  - cookieAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: app_access
  responses:
    Problem:
      description: RFC-7807 problem+json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: boolean }
        redis:
          oneOf: [{ type: boolean }, { type: string, enum: [disabled] }]
        dms:
          oneOf: [{ type: boolean }, { type: string, enum: [disabled] }]
        authMode: { type: string, enum: [enforce, optional, disabled] }
        uptimeSeconds: { type: integer }
    Session:
      type: object
      properties:
        authenticated: { type: boolean }
        claims:
          type: object
          description: The VERIFIED access-token payload — never the token itself.
        expiresIn: { type: integer }
    Me:
      type: object
      properties:
        subject: { type: string }
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [ADMIN, MANAGER, USER] }
        personas:
          type: array
          items: { type: string, enum: [ADMIN, MANAGER, USER] }
        tenantId: { type: [string, 'null'] }
        tenantName: { type: [string, 'null'] }
        verified: { type: boolean }
        permissions:
          type: object
          additionalProperties: { type: boolean }
    Note:
      type: object
      properties:
        noteId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    PasswordInvitation:
      type: object
      properties:
        kcUserId: { type: string }
        username: { type: string }
        email: { type: string }
        purpose: { type: string, enum: [provision, reset] }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: [string, 'null'], format: date-time }
        mailed: { type: boolean }
        state: { type: string, enum: [set, expired, not_sent, invited] }
    StoredDocument:
      type: object
      properties:
        documentId: { type: string }
        fileName: { type: string }
        mimeType: { type: [string, 'null'] }
        size: { type: [integer, 'null'] }
        documentType: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
    Problem:
      type: object
      description: RFC-7807 problem+json — the error shape every endpoint answers with.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        violations:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
