# Build and push the two deployable images. Everything project-specific is a
# repository VARIABLE or SECRET — nothing here names a personal registry
# account, an image repo, or a cluster namespace.
#
# Configure in the forked repo (Settings → Secrets and variables → Actions):
#   vars.REGISTRY        e.g. docker.io, ghcr.io, registry.example.com
#   vars.IMAGE_PREFIX    e.g. myorg/myapp   → myorg/myapp-backend, myorg/myapp-frontend
#   secrets.REGISTRY_USERNAME
#   secrets.REGISTRY_PASSWORD
name: Docker release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (defaults to the short SHA)'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # The backend image builds the MFA phone UI from the mfa-ui workspace
      # via a named build context (see backend/Dockerfile).
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-contexts: |
            mfa-ui=./mfa-ui
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.tag }}
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Optional CD ────────────────────────────────────────────────────────────
  # Uncomment and adapt once your cluster exists. Needs a runner that can
  # reach it (usually self-hosted) and vars.K8S_NAMESPACE + deployment names.
  #
  # deploy:
  #   name: Deploy to cluster
  #   needs: build-and-push
  #   runs-on: self-hosted
  #   steps:
  #     - name: Roll backend
  #       run: |
  #         kubectl -n ${{ vars.K8S_NAMESPACE }} set image deployment/backend \
  #           backend=${{ vars.REGISTRY }}/${{ vars.IMAGE_PREFIX }}-backend:${{ github.ref_name }}
  #         kubectl -n ${{ vars.K8S_NAMESPACE }} rollout status deployment/backend --timeout=300s
  #     - name: Roll frontend
  #       run: |
  #         kubectl -n ${{ vars.K8S_NAMESPACE }} set image deployment/frontend \
  #           frontend=${{ vars.REGISTRY }}/${{ vars.IMAGE_PREFIX }}-frontend:${{ github.ref_name }}
  #         kubectl -n ${{ vars.K8S_NAMESPACE }} rollout status deployment/frontend --timeout=300s
