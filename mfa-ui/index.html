<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-in approval</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eef2f8;
        color: #131c2e;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.55;
      }
      main {
        max-width: 26rem;
        width: 100%;
        background: #fff;
        border: 1px solid #e4eaf2;
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow:
          0 6px 16px rgba(19, 28, 46, 0.08),
          0 2px 6px rgba(19, 28, 46, 0.05);
      }
      .mark {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #1e7488;
        font-weight: 600;
        margin: 0 0 14px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 16px;
        font-size: 14px;
        color: #4e5d75;
      }
      button {
        width: 100%;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: #0f6e64;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status {
        margin-top: 14px;
        font-size: 14px;
      }
      .status.ok {
        color: #0f6e64;
        font-weight: 600;
      }
      .status.err {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Security check</p>
      <h1 id="title">Loading…</h1>
      <p id="copy"></p>
      <button id="action" hidden></button>
      <p id="status" class="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
