# The whole development stack, containerized and SELF-BOOTSTRAPPING:
# Postgres, the Node backend (which applies its own migrations on start),
# Redis, Keycloak with the realm auto-imported AND auto-seeded (kc-bootstrap
# runs keycloak-local/setup-dev.mjs — roles, grants, demo accounts), Mailpit
# as the mail sink, the nginx frontend, and (behind the `dms` profile) a local
# Mayan EDMS. One command from nothing:
#
#   cp .env.dev.example .env        # once — states APP_DEV_PASSWORD
#   docker compose -f docker-compose.dev.yml up -d --build
#
#   frontend  http://localhost:3000   (demo accounts: keycloak-local/README.md)
#   backend   http://localhost:8081   (/health, /app/v1, /api/v1, /api/v1/docs/)
#   keycloak  http://localhost:8085   (admin / admin)
#   postgres  localhost:5433          (postgres/postgres, db app_db — 5433 so a
#                                      machine's own PostgreSQL keeps 5432)
#   mailpit   http://localhost:8025   (every mail the stack sends lands here)
#   mayan     http://localhost:8888   (only with: --profile dms)
#
# Data lives in named volumes, so `down` keeps it and `up` is idempotent
# (migrations report "nothing to apply", the seeders re-run and change
# nothing). `down -v` wipes everything for a genuine cold start. Note that
# Keycloak's --import-realm only runs against an EMPTY database — kc-bootstrap
# repairs roles/grants/users on every up, but a changed realm-export.json's
# CLIENTS/MAPPERS need the keycloak volume removed first.
#
# OVERRIDE CONVENTION: every value a developer may need to change is
# `${APP_X:-default}`, so a plain-named .env for the HOST process can never
# leak into container config by accident.
services:
  postgres:
    image: postgres:16-alpine
    container_name: app-dev-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on purpose: dev machines often run PostgreSQL as a host service
      # on 5432. Host psql reaches this one with -p 5433.
      - '5433:5432'
    volumes:
      - dev-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_db']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: app-dev-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      # PIN the issuer. Browsers reach this Keycloak at localhost:8085 and the
      # other containers at keycloak:8080; with a dynamic hostname those mint
      # and validate against DIFFERENT issuers, and the backend's issuer check
      # then refuses every token the browser holds. A fixed hostname makes the
      # issuer localhost:8085 everywhere; backchannel-dynamic keeps the
      # in-network URL usable for JWKS, the password grant and the admin API
      # (which is how kc-bootstrap below seeds through keycloak:8080).
      KC_HOSTNAME: http://localhost:8085
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports:
      - '8085:8080'
    volumes:
      # PERSISTENT: the dev H2 database (realm + seeded users) survives
      # container recreates. kc-bootstrap re-seeds on every up, so users and
      # roles self-heal — but --import-realm only runs against an EMPTY
      # database, so a CHANGED realm-export.json's clients/mappers need:
      #   docker compose -f docker-compose.dev.yml down keycloak
      #   docker volume rm fullstack-template_dev-keycloak-data
      #   docker compose -f docker-compose.dev.yml up -d keycloak kc-bootstrap
      - dev-keycloak-data:/opt/keycloak/data
      - ./keycloak-local/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    restart: unless-stopped

  # One-shot seeder: everything the realm export does NOT carry — service
  # account grants, local web origins, and EVERY demo account (the export
  # ships zero humans; without this run nobody can sign in). setup-dev.mjs is
  # dependency-free (global fetch, no node_modules) and idempotent, so
  # re-running on every `up` is cheap and repairs a stale keycloak volume. The
  # retry loop IS the readiness probe — the Keycloak image ships no curl/wget
  # to healthcheck with, and the script simply fails fast until it answers.
  kc-bootstrap:
    image: node:22-alpine
    container_name: app-dev-kc-bootstrap
    working_dir: /tmp
    environment:
      KC: http://keycloak:8080
      REALM: app-realm
      KC_ADMIN: admin
      KC_ADMIN_PASSWORD: admin
      # STATED ONCE, in your repo-root .env (cp .env.dev.example .env). No
      # committed default on purpose — a template that ships a literal dev
      # password ships it to every fork forever.
      APP_DEV_PASSWORD: ${APP_DEV_PASSWORD:?Copy .env.dev.example to .env and set APP_DEV_PASSWORD}
    volumes:
      - ./keycloak-local:/seed:ro
      # The shared structure module (realm roles + tenants) lives in
      # backend/scripts and setup-dev.mjs imports it relatively — mounted at
      # the path that relative import resolves to from /seed.
      - ./backend/scripts/kc-realm-structure.mjs:/backend/scripts/kc-realm-structure.mjs:ro
    command:
      - sh
      - -c
      - |
        i=0
        until node /seed/setup-dev.mjs; do
          i=$$((i+1))
          if [ "$$i" -ge 60 ]; then
            echo '[kc-bootstrap] keycloak never became seedable' >&2
            exit 1
          fi
          echo "[kc-bootstrap] keycloak not ready yet (attempt $$i) — retrying in 5s"
          sleep 5
        done
    depends_on:
      - keycloak
    restart: 'no'

  redis:
    image: redis:7-alpine
    container_name: app-dev-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - dev-redis-data:/data
    restart: unless-stopped

  # ─── Mailpit — every email the stack sends lands HERE ──────────────────────
  # A catch-all SMTP sink: no relay, no credential, nothing leaves the machine.
  # Read what the app sent at http://localhost:8025 (API /api/v1/messages).
  # backend/mail.dev.env points the backend at it; a real relay credential in
  # backend/.env.mail (gitignored) loads AFTER that file and overrides it.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: app-dev-mailpit
    ports:
      - '8025:8025'
      # SMTP on the host too, so a script outside the stack can send into the
      # sink (the backend reaches it as mailpit:1025 on the compose network).
      - '1025:1025'
    restart: unless-stopped

  # ─── Local Mayan EDMS — the document store, behind the `dms` PROFILE ────────
  # Heavy (first boot runs migrations for several minutes), so it only starts
  # when asked:
  #   APP_DMS_ENABLED=true docker compose -f docker-compose.dev.yml --profile dms up -d --build
  # Browse it at http://localhost:8888 (admin / the APP_MAYAN_PASSWORD below).
  mayan-db:
    image: postgres:14-alpine
    container_name: app-dev-mayan-db
    profiles: ['dms']
    environment:
      POSTGRES_DB: mayan
      POSTGRES_USER: mayan
      POSTGRES_PASSWORD: mayanpass
    volumes:
      - dev-mayan-db:/var/lib/postgresql/data
    restart: unless-stopped

  mayan-redis:
    image: redis:7-alpine
    container_name: app-dev-mayan-redis
    profiles: ['dms']
    restart: unless-stopped

  mayan:
    image: mayanedms/mayanedms:v4.12.1
    container_name: app-dev-mayan
    profiles: ['dms']
    ports:
      - '8888:8000'
    environment:
      MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'mayan','PASSWORD':'mayanpass','USER':'mayan','HOST':'mayan-db'}}"
      MAYAN_CELERY_BROKER_URL: redis://mayan-redis:6379/0
      MAYAN_CELERY_RESULT_BACKEND: redis://mayan-redis:6379/1
      # Applies on FIRST boot only; an existing volume keeps its password.
      MAYAN_AUTOADMIN_PASSWORD: ${APP_MAYAN_PASSWORD:-mayan-dev-pass}
    volumes:
      - dev-mayan-data:/var/lib/mayan
    depends_on:
      - mayan-db
      - mayan-redis
    healthcheck:
      # The image ships no curl/wget — probe with its python. Any HTTP answer
      # (including 4xx) means the server is up; only a connect failure is down.
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, urllib.error, sys
          try:
              urllib.request.urlopen('http://localhost:8000/api/v4/', timeout=4)
          except urllib.error.HTTPError:
              pass
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  # One-shot provisioner: the same scripts/dms-ensure.mjs every backend boot
  # runs when DMS_ENABLED. This one-shot exists because the dev backend boots
  # minutes before a cold-started Mayan turns healthy, so its own boot-time
  # ensure fails (non-fatally) — this job re-runs it once Mayan answers.
  mayan-bootstrap:
    image: node:22-alpine
    container_name: app-dev-mayan-bootstrap
    profiles: ['dms']
    working_dir: /tmp
    entrypoint: ['node', '/bootstrap/dms-ensure.mjs']
    environment:
      DMS_URL: http://mayan:8000/api/v4
      DMS_USERNAME: admin
      DMS_PASSWORD: ${APP_MAYAN_PASSWORD:-mayan-dev-pass}
    volumes:
      - ./backend/scripts/dms-ensure.mjs:/bootstrap/dms-ensure.mjs:ro
    depends_on:
      mayan:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      # THE REPO ROOT, not ./backend: npm workspaces keep the one lockfile
      # here, and the image also builds the mfa-ui workspace (backend/Dockerfile).
      context: .
      dockerfile: backend/Dockerfile
    container_name: app-dev-backend
    ports:
      - '8081:8081'
    environment:
      PORT: 8081
      APP_NAME: ${APP_NAME:-App Portal}
      BASE_PATHS: /app/v1,/api/v1
      # 5173 = vite dev server, 3000 = the containerized frontend. Same-origin
      # calls through either proxy carry no Origin, so this only matters for
      # direct calls.
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      # The in-stack Postgres above. The entrypoint applies migrations before
      # serving, so a fresh volume bootstraps the whole schema.
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/app_db}
      AUTH_MODE: ${APP_AUTH_MODE:-enforce}
      # Swagger UI at :3000/app/v1/docs/ (through nginx) and :8081/api/v1/docs/
      # (direct). Dev stack only — the image default is off.
      API_DOCS_ENABLED: 'true'
      # JWKS is fetched in-network; the browser's tokens name localhost:8085 as
      # issuer, so the issuer check is pinned to that.
      KC_URL: http://keycloak:8080
      KC_ISSUER: http://localhost:8085/realms/app-realm
      KC_REALM: app-realm
      KC_CLIENT_ID: web-app
      # The image defaults this to true (production posture); this stack is
      # plain http on localhost, where a Secure cookie never comes back and
      # nobody can stay signed in.
      AUTH_COOKIE_SECURE: 'false'
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      # The document store — the in-stack Mayan when the `dms` profile is up.
      # Off by default so the ordinary stack needs no Mayan at all; the
      # /document facade then answers placeholder references.
      DMS_ENABLED: ${APP_DMS_ENABLED:-false}
      DMS_URL: ${APP_DMS_URL:-http://mayan:8000/api/v4}
      DMS_USERNAME: ${APP_DMS_USERNAME:-admin}
      DMS_PASSWORD: ${APP_DMS_PASSWORD:-${APP_MAYAN_PASSWORD:-mayan-dev-pass}}
      DMS_DOCUMENT_TYPE: ${APP_DMS_DOCUMENT_TYPE:-Default}
      DMS_TLS_INSECURE: ${APP_DMS_TLS_INSECURE:-false}
      # ─── The WebAuthn second factor (src/mfa) ──────────────────────────────
      # The three that must agree, naming the origin the BROWSER sees — this
      # stack's nginx door (and the vite loop; MFA_ORIGINS takes the list),
      # never this container's in-network address. Enrolments live in Postgres
      # (app.mfa_credentials) and survive container recreates.
      # Testing from a physical phone: run a tunnel in front of :3000 and point
      # all three at ITS host (APP_MFA_RP_ID / APP_MFA_ORIGINS /
      # APP_MFA_PUBLIC_URL), then open the app ON THE TUNNEL HOST from the
      # desktop too — every host must agree or the passkey binds to a site the
      # ceremony never sees.
      MFA_RP_ID: ${APP_MFA_RP_ID:-localhost}
      MFA_ORIGINS: ${APP_MFA_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MFA_PUBLIC_URL: ${APP_MFA_PUBLIC_URL:-http://localhost:3000}
      # FALSE only here. The approval page refuses desktop browsers in any real
      # environment; on this stack a laptop has to be able to walk the flow.
      # The same-device refusal stays ON — it never blocks a legitimate phone.
      MFA_REQUIRE_MOBILE: 'false'
      # SMS off by default: the gateway is a real phone relaying real messages.
      # Switch on per run without putting credentials in this file:
      #   APP_SMS_ENABLED=true APP_SMS_USERNAME=... APP_SMS_PASSWORD=... \
      #     docker compose -f docker-compose.dev.yml up -d backend
      SMS_ENABLED: ${APP_SMS_ENABLED:-false}
      SMS_USERNAME: ${APP_SMS_USERNAME:-}
      SMS_PASSWORD: ${APP_SMS_PASSWORD:-}
      # The service account (boot-time realm ensure + server-side lookups).
      # The local realm imported app-provisioning-service with the export's
      # dev secret — fine here, and exactly the thing to regenerate before any
      # deployment.
      KC_SERVICE_CLIENT_ID: app-provisioning-service
      KC_SERVICE_CLIENT_SECRET: ${APP_KC_SERVICE_CLIENT_SECRET:-dev-provisioning-secret}
      # Where the links in mail point — the origin the RECIPIENT's browser can
      # reach.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      LOG_FORMAT: json
    # ─── Outbound email: ON by default, INTO MAILPIT ─────────────────────────
    # mail.dev.env (committed, no secret) points the mailer at the sink above,
    # so the emails the app generates are real and readable at :8025. A REAL
    # relay stays where it always was — backend/.env.mail, gitignored — and
    # because that file loads SECOND it overrides the sink key by key.
    env_file:
      - path: ./backend/mail.dev.env
        required: true
      - path: ./backend/.env.mail
        required: false
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      # Healthy, not merely started: the entrypoint's first act is applying
      # migrations, and pg_isready is what says the database will answer.
      # (The entrypoint also retries on its own — belt and braces.)
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: app-dev-frontend
    ports:
      - '3000:80'
    environment:
      APP_NAME: ${APP_NAME:-App Portal}
      # What the BROWSER uses — must be reachable from the host machine.
      KC_URL: http://localhost:8085
      # What NGINX uses server-to-server (the /kcadmin proxy).
      KC_INTERNAL_URL: http://keycloak:8080
      KC_REALM: app-realm
      API_BASE: /app/v1
      API_UPSTREAM: http://backend:8081
      USERS_BASE: /app/v1/kcadmin
      # Off by default locally (no phone at hand); flip per run with
      # APP_MFA_ENABLED=true to exercise the second factor the way a
      # deployment (default true) does.
      MFA_ENABLED: ${APP_MFA_ENABLED:-false}
      # Empty = "this origin". Pin it only for phone testing through a tunnel
      # (see the backend's MFA notes above).
      MFA_BASE: ${APP_MFA_BASE:-}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  dev-pg-data:
  dev-redis-data:
  dev-keycloak-data:
  dev-mayan-data:
  dev-mayan-db:
